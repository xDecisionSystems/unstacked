name: App CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked tooling and dependencies
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.10.11'
          uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Verify migration head
        run: >-
          uv run python -c
          'from pathlib import Path; from app.models import migrate_schema;
          migrate_schema(Path(".ci-data/app.db"))'
      - name: Build package
        run: uv build
      - name: Create a portable content repository
        run: |
          uv run python -c 'from app.config import Settings; from app.content import ContentRepository; ContentRepository(Settings()).initialize()'
      - name: Run worst-case recovery drill
        run: UNSTACKED_PYTHON=python scripts/worstcase_drill.sh content
