<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forgot password · Unstacked</title><link rel="stylesheet" href="/static/style.css">{{ theme_style(request) }}</head><body class="auth-page"><div class="auth-card"><h1>Reset your password</h1>{% if sent %}<p>If that email belongs to an active account, a reset link has been sent.</p><p><a href="/login">Back to sign in</a></p>{% else %}<p>Enter your account email address.</p><form method="post" action="/forgot-password"><label>Email<input name="email" type="email" autocomplete="email" required autofocus></label><button type="submit">Send reset link</button></form><p><a href="/login">Back to sign in</a></p>{% endif %}</div></body></html>
