<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password · Unstacked</title><link rel="stylesheet" href="/static/style.css">{{ theme_style(request) }}</head><body class="auth-page"><div class="auth-card"><h1>Set a new password</h1>{% if error %}<p class="error-message">{{ error }}</p>{% endif %}{% if valid %}<form method="post" action="{{ request.url.path }}?{{ request.url.query }}"><label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" required autofocus></label><button type="submit">Set password</button></form>{% else %}<p>Request a new password reset link.</p><p><a href="/forgot-password">Forgot password?</a></p>{% endif %}</div></body></html>
