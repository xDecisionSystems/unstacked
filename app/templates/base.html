<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Unstacked{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {{ theme_style(request) }}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/tree">Unstacked</a>
    <form class="site-search" method="get" action="/search" role="search">
      <label class="visually-hidden" for="site-search-query">Search content</label>
      <input id="site-search-query" name="q" type="search" placeholder="⌕  Search every page…" value="{{ query|default('') }}">
    </form>
    {% if current_user %}<form method="post" action="/logout">
      {% if is_admin %}<a class="settings-link" href="/settings" aria-label="Settings" title="Settings"><span aria-hidden="true">⚙</span><span class="visually-hidden">Settings</span></a>{% endif %}
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="quiet-action" type="submit">Log out</button>
    </form>{% else %}<a class="quiet-action" href="/login">Log in</a>{% endif %}
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
