<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Unstacked{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/tree">Unstacked</a>
    <form class="site-search" method="get" action="/search" role="search">
      <label class="visually-hidden" for="site-search-query">Search content</label>
      <input id="site-search-query" name="q" type="search" placeholder="Search content" value="{{ query|default('') }}">
      <button type="submit">Search</button>
    </form>
    <form method="post" action="/logout">
      <span class="whoami">{{ current_user.display_name }}</span>
      {% if is_admin %}<a href="/manage">Manage content</a><a href="/admin">Admin</a>{% endif %}
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Log out</button>
    </form>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="Content tree">
      {% include "_tree.html" %}
    </nav>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
