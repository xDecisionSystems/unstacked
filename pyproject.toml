[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "unstacked"
version = "0.1.0"
description = "A file-based, Git-backed wiki with permission-aware AI endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = [
  "alembic>=1.17,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.128,<1",
  "filelock>=3.20,<4",
  "GitPython>=3.1.45,<4",
  "mkdocs==1.6.1",
  "mkdocs-awesome-nav==3.3.0",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.12,<3",
  "PyJWT>=2.10,<3",
  "python-frontmatter>=1.1,<2",
  "python-slugify>=8.0,<9",
  "PyYAML>=6.0,<7",
  "sqlmodel>=0.0.34,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
unstacked-bootstrap = "app.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
