server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html/site;
    index index.html;
    autoindex off;

    # The management app publishes only completed static output to this
    # read-only volume.  Until its first build succeeds, serve this harmless
    # placeholder instead of exposing a listing or an upstream error.
    location / {
        try_files $uri $uri/index.html /_unstacked-empty.html;
    }

    location = /_unstacked-empty.html {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Public workspace</title></head><body><h1>Public workspace</h1><p>No public content is available yet.</p></body></html>';
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
