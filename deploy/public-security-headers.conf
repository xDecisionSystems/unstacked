# Shared by both the server block and the empty-state location in
# public-nginx.conf. nginx's add_header directive is NOT additive across
# nesting levels: a location that declares even one add_header of its own
# (the empty-state location sets Cache-Control) does not inherit any
# server-level add_header lines -- it would otherwise silently serve that
# one response without these. Included in both places instead, so there is
# one copy to keep correct rather than two to keep in sync by hand.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
