services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${UNSTACKED_HOST_PORT:-8001}:8000"
    environment:
      UNSTACKED_ENVIRONMENT: production
      # Required in production — the app refuses to start without it. Set
      # this in Coolify's environment variables UI, never in this file.
      UNSTACKED_API_TOKEN_SECRET: ${UNSTACKED_API_TOKEN_SECRET:?set UNSTACKED_API_TOKEN_SECRET}
      UNSTACKED_API_TOKEN_AUDIENCE: ${UNSTACKED_API_TOKEN_AUDIENCE:-unstacked-ai}
      UNSTACKED_API_TOKEN_TTL_SECONDS: ${UNSTACKED_API_TOKEN_TTL_SECONDS:-3600}
      UNSTACKED_SESSION_TTL_SECONDS: ${UNSTACKED_SESSION_TTL_SECONDS:-43200}
      UNSTACKED_LOGIN_ATTEMPTS_PER_MINUTE: ${UNSTACKED_LOGIN_ATTEMPTS_PER_MINUTE:-5}
      # Set to the number of reverse proxies in front of the app. Coolify
      # puts one (Traefik) in front by default, so this is usually 1.
      UNSTACKED_TRUSTED_PROXY_HOPS: ${UNSTACKED_TRUSTED_PROXY_HOPS:-1}
      UNSTACKED_MAX_RATE_LIMIT_KEYS: ${UNSTACKED_MAX_RATE_LIMIT_KEYS:-10000}
      UNSTACKED_MAX_PAGE_BYTES: ${UNSTACKED_MAX_PAGE_BYTES:-2000000}
      UNSTACKED_MAX_EXPORT_BYTES: ${UNSTACKED_MAX_EXPORT_BYTES:-50000000}
      UNSTACKED_MAX_UPLOAD_BYTES: ${UNSTACKED_MAX_UPLOAD_BYTES:-10485760}
      UNSTACKED_MAX_UPLOAD_DIMENSION: ${UNSTACKED_MAX_UPLOAD_DIMENSION:-12000}
      UNSTACKED_MAX_UPLOAD_PIXELS: ${UNSTACKED_MAX_UPLOAD_PIXELS:-40000000}
      UNSTACKED_CONTENT_LOCK_TIMEOUT_SECONDS: ${UNSTACKED_CONTENT_LOCK_TIMEOUT_SECONDS:-15}
      UNSTACKED_STATIC_EXPORT_PATH: /app/data/static-export
      UNSTACKED_STATIC_EXPORT_TIMEOUT_SECONDS: ${UNSTACKED_STATIC_EXPORT_TIMEOUT_SECONDS:-120}
      UNSTACKED_STATIC_EXPORT_OUTPUT_LIMIT_BYTES: ${UNSTACKED_STATIC_EXPORT_OUTPUT_LIMIT_BYTES:-65536}
      UNSTACKED_BACKUP_SYNC_DEBOUNCE_SECONDS: ${UNSTACKED_BACKUP_SYNC_DEBOUNCE_SECONDS:-10}
      UNSTACKED_BACKUP_SYNC_MAX_BACKOFF_SECONDS: ${UNSTACKED_BACKUP_SYNC_MAX_BACKOFF_SECONDS:-300}
      UNSTACKED_BACKUP_CONFIG_PATH: /app/data/backup_config.json
      # Content backup remote. The repository MUST be private: the backup is a
      # complete, unfiltered copy of the wiki including drafts, with no
      # per-user permissions. Nothing verifies that over the network, so the
      # remote is not configured at all unless it is confirmed here.
      UNSTACKED_GITHUB_REMOTE_URL: ${UNSTACKED_GITHUB_REMOTE_URL:-}
      UNSTACKED_GITHUB_REMOTE_CONFIRMED_PRIVATE: ${UNSTACKED_GITHUB_REMOTE_CONFIRMED_PRIVATE:-false}
      # Prefer mounting the token as a file (a path is not a secret) over
      # setting UNSTACKED_GITHUB_TOKEN, which is visible to anything that can
      # read this container's configuration.
      UNSTACKED_GITHUB_TOKEN_PATH: ${UNSTACKED_GITHUB_TOKEN_PATH:-}
      UNSTACKED_GITHUB_TOKEN: ${UNSTACKED_GITHUB_TOKEN:-}
      # SSH alternative: a deploy key plus the known_hosts entry its host key
      # is pinned against. Both are required together.
      UNSTACKED_GITHUB_SSH_KEY_PATH: ${UNSTACKED_GITHUB_SSH_KEY_PATH:-}
      UNSTACKED_GITHUB_SSH_KNOWN_HOSTS_PATH: ${UNSTACKED_GITHUB_SSH_KNOWN_HOSTS_PATH:-}
    volumes:
      # The wiki's Git repository and the SQLite/lock/secret files are the
      # entire state of the application. Losing these volumes loses the wiki;
      # snapshot them through Coolify or configure an optional backup target.
      - content:/app/content
      - data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  content:
  data:
